<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="480" viewBox="0 0 1800 480">
<title>Official data provenance in three lanes</title><desc>The source lane names four official datasets with their record grains. Nine original files enter Bronze, then Silver and Gold. Gold feeds warehouse project facts and history; Silver feeds municipal context directly. Counts at different grains are not additive.</desc>
