<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="480" viewBox="0 0 1800 480">
<title>From official evidence to usable project records</title><desc>Three reader-oriented zones show the evidence, traceable preparation and usable results. The warehouse holds annual facts, historical project versions and municipal context. The dashed line shows municipal context entering PostgreSQL directly from Silver. Official and synthetic records remain separate; counts at different grains are not additive.</desc>
